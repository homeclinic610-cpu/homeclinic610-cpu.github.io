<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حالاتي – Dental Cases</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#0f2238;--mu:#5b6f84;--gd:#9c7220;--bl:#2a7ebc;--bd:#d3dfeb;--gold:linear-gradient(135deg,#f0d98a,#d4b574 50%,#b98f42);--sky:linear-gradient(135deg,#5fd6f6,#40a4d5 55%,#2a7ebc);--ink:#0c1a34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a34;--card:#122a48;--tx:#eef3f8;--mu:#9fb4c9;--gd:#d4b574;--bl:#5fd6f6;--bd:#1f4166}}
:root[data-theme="dark"]{--bg:#0c1a34;--card:#122a48;--tx:#eef3f8;--mu:#9fb4c9;--gd:#d4b574;--bl:#5fd6f6;--bd:#1f4166}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px;color:var(--gd)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
textarea{min-height:80px}
button{cursor:pointer;width:auto}
.pri{background:var(--gold);color:var(--ink);border:0;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:14px}
.chip{border-color:var(--bl)}
.chip.on{background:var(--gold);color:var(--ink);border-color:transparent;font-weight:700}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bl);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.mu{color:var(--mu);font-size:13px}
.th{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.big img{width:100%;height:auto;margin-bottom:8px;border-radius:10px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;border-radius:50%;width:56px;height:56px;font-size:28px;padding:0;box-shadow:0 2px 8px #0004}
.hide{display:none}
.wm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(72vw,360px);aspect-ratio:1;background:url(icons/wm-light.png) center/contain no-repeat;opacity:.2;pointer-events:none;z-index:-1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{background:url(icons/icon-512.png) center/cover;border-radius:22%;opacity:.16}}
:root[data-theme="dark"] .wm{background:url(icons/icon-512.png) center/cover;border-radius:22%;opacity:.16}
.ph{position:relative}
.ph svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--bl);pointer-events:none}
.ph input{padding-left:42px;text-align:left}
.pv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.pv a{border:1px solid var(--bl);color:var(--bl);border-radius:999px;padding:5px 12px;text-decoration:none;font-size:14px}
.spc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.tc{direction:ltr;margin:6px 0 2px}
.tr2{display:flex;margin-bottom:8px}
.tr2 .h{display:flex;flex:1;min-width:0}
.tr2 .h+.h{border-left:2px solid var(--bd);margin-left:3px;padding-left:3px}
.tt{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;border-radius:6px;color:var(--mu);font-size:9px;cursor:pointer}
.tt:active{background:#8883}
.tt.ro{pointer-events:none}
.tt svg{width:100%;height:30px;display:block}
.tt path{fill:var(--card);stroke:var(--mu);stroke-width:1.4}
.tt b{font-weight:600;font-size:9px;line-height:1}
.tt i{display:flex;gap:2px;height:4px}
.tt .d{width:4px;height:4px;border-radius:50%;display:block}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin:2px 0 8px}
.lgd .d,.chip .dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs{border-top:1px solid var(--bd);padding:10px 0}
.vs b{display:block;margin-bottom:4px}
.vs div{margin:3px 0;font-size:14px}
.vs .dt,.vsh .dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.ses{border-top:1px solid var(--bd);padding:12px 0;margin-top:6px}
.ses>b{display:block;margin-bottom:4px}
.tc.p1{width:72%;margin:6px auto 2px}
.tc.p2{width:64%;margin:6px auto 2px}
.dtl{font-size:11px;color:var(--mu);text-align:center;direction:ltr;margin:8px 0 0}
#list,#view,#aview,#form{padding-bottom:104px}
body.am .np{display:none!important}
#bar{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -4px 16px #0002}
#bar.hide{display:none}
#bar button{border:0;background:transparent;color:var(--bl);width:58px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:16px}
#bar button:active{opacity:.7}
#bar .home{width:70px;height:70px;border-radius:50%;background:var(--gold);color:var(--ink);margin-top:-26px;box-shadow:0 4px 14px #0005;border:4px solid var(--bg)}
.ap{display:none}
body.am label.ap{display:block}
body.am input.ap{display:block}
.sec{font-weight:700;color:var(--gd);margin:10px 0 6px}
.apc{border-inline-start:4px solid var(--bl)}
.od{color:#d9534f;font-size:12px;font-weight:700}
#tour{position:fixed;inset:0;background:#000b;z-index:100;display:none;justify-content:center;padding:16px}
#tour.on{display:flex}
#tour[data-pos="mid"]{align-items:center}
#tour[data-pos="bot"]{align-items:flex-end;padding-bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#tour[data-pos="top"]{align-items:flex-start;padding-top:calc(86px + env(safe-area-inset-top,0px))}
.tcard{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:420px;text-align:center;align-self:auto}
.tic{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center}
.tic svg{width:28px;height:28px}
.tcard b{font-size:18px;color:var(--gd)}
.tcard p{margin:8px 0 12px;line-height:1.7}
.tdots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--bd)}
.tdots i.on{background:var(--gd);width:18px;border-radius:4px}
#bar button.tgt:not(.home){background:var(--card)}
.tgt{position:relative;z-index:101;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--bl)!important;animation:pls 1.3s infinite}
@keyframes pls{50%{transform:scale(1.08)}}
.soon{border:2px solid var(--gd);margin-bottom:10px}
.soon b{display:flex;gap:6px;align-items:center;color:var(--gd);margin-bottom:4px}
.soon .mu{padding:3px 0;cursor:pointer}
.appmark{width:36px;height:36px;border-radius:10px;vertical-align:middle;margin-inline-end:8px}
.hd h1 .appmark{height:36px;margin-bottom:0}
.ic{display:inline-flex;align-items:center;justify-content:center;padding:8px;color:var(--bl);border-color:var(--bl)}
.hd{display:flex;align-items:center;gap:8px}.hd h1{margin:6px 0 12px;flex:1}.hd img{height:36px;margin-bottom:6px}
.slots{display:block}
.stage{margin-bottom:12px}
.sh{font-size:13px;color:var(--mu);margin-bottom:6px}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb{position:relative;aspect-ratio:1}
.tb img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.tb i{position:absolute;top:4px;inset-inline-end:4px;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-style:normal;cursor:pointer}
.add{aspect-ratio:1;margin:0;text-align:center;font-size:14px;gap:4px;flex-direction:column;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer}
.add input{display:none}
.cnt{font-size:13px;color:var(--mu);margin:2px 0 10px}
.fbb{background:var(--sky);color:#fff;border:0;display:flex;align-items:center;justify-content:center;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;border-radius:50%;width:56px;height:56px;padding:0;box-shadow:0 2px 10px #0006}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:640px}
.sheet textarea{margin:8px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sg div{font-size:13px;color:var(--mu)}.sg img{width:100%;border-radius:10px;display:block}
#pr{display:none}
@media print{#bar,#tour,.wm,.add,.tb i,button,.fbb,.ov{display:none!important}body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:8px}#pr img.lg{height:50px}#pr .sg div{color:#333}#pr .sg>div{break-inside:avoid}@page{margin:12mm}}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
.note{font-size:12px;color:var(--mu);margin-top:6px}
</style>
</head>
<body>
<div id="list">
  <div class="wm" aria-hidden="true"></div>
  <div class="hd"><img id="lg" class="hide" alt=""><h1><img class="appmark" src="icons/icon-192.png" alt="">حالاتي</h1><button id="fbo" class="ic" aria-label="شكاوي واقتراحات"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg></button><button id="gear" class="ic" aria-label="الإعدادات"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  <div id="set" class="card hide"><b>لوجو خاص بك (اختياري)</b><div class="mu" style="margin:4px 0 8px">يظهر في التطبيق وفي ملف الـ PDF.</div><div class="row"><label class="pri" style="margin:0;padding:10px;border-radius:10px;color:#fff">اختر لوجو<input id="lf" type="file" accept="image/*" hidden></label><button id="lrm">حذف اللوجو</button></div><div id="ntxt" class="mu" style="margin-top:10px"></div><button id="nbtn" style="margin-top:6px;width:100%">تفعيل تنبيهات المواعيد</button><button id="tourbtn" style="margin-top:8px;width:100%">إعادة الجولة التعريفية</button></div>
  <input id="q" placeholder="ابحث في الحالات...">
  <div class="chips" id="chips" style="margin-top:8px"></div>
  <div id="appts"></div>
  <div id="cards"></div>
  <div class="ov" id="fbm"><div class="sheet">
    <b>شكاوي واقتراحات</b>
    <div class="mu" style="margin:4px 0 8px">تُرسل إلينا عبر واتساب فقط.</div>
    <select id="fbk"><option>اقتراح</option><option>شكوى</option></select>
    <textarea id="fbt" placeholder="اكتب رسالتك هنا... (بدون أي بيانات مرضى)"></textarea>
    <div class="row" style="margin:8px 0 0"><button class="pri" id="fbs" style="flex:1">إرسال عبر واتساب</button><button id="fbc">إلغاء</button></div>
  </div></div>
</div>

<div id="form" class="hide">
  <h1 id="ft">حالة جديدة</h1>
  <label class="pf">اسم المريض</label><input id="t" class="pf" placeholder="مثال: مصطفى أحمد">
  <div class="two pf"><div><label>العمر (بالسنوات)</label><input id="ag" type="number" inputmode="numeric" min="0" max="120" placeholder="مثال: 35"></div>
  <div><label>النوع</label><div class="spc" id="sx"></div></div></div>
  <label>التخصص (يمكنك اختيار أكثر من تخصص)</label><div class="spc" id="sps"></div>
  <label>مرحلة الأسنان (Dentition)</label><div class="spc" id="dn"></div>
  <label>الأسنان (اضغط على السن لتحديد ما تم عليه)</label>
  <div id="tc"></div>
  <div class="ov" id="tm"><div class="sheet">
    <b id="tmt"></b>
    <div class="mu" style="margin:4px 0 8px">اختر ما تم عمله على هذا السن (يمكن أكثر من اختيار)</div>
    <div class="spc" id="tmo"></div>
    <div class="row" style="margin:8px 0 0"><button class="pri" id="tmd" style="flex:1">تم</button><button id="tmc">مسح العلامة</button></div>
  </div></div>
  <label id="dl2">التاريخ</label><input id="d" type="date">
  <label class="ap">الساعة (اختيارية)</label><input id="ti" type="time" class="ap">
  <label class="pf">رقم هاتف المريض (اختياري)</label><div class="ph pf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><input id="ph" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx" autocomplete="off"></div>
  <label class="np">الصور (داخل الفم فقط) – يمكنك إضافة أكثر من صورة لكل مرحلة (بدون حد أقصى)</label>
  <div class="cnt np" id="cnt"></div>
  <div class="slots np" id="slots"></div>
  <label>التفاصيل (التشخيص، خطوات العلاج، الخامات...)</label><textarea id="n"></textarea>
  <div class="note">ملحوظة: الاسم ورقم الهاتف يُحفظان على جهازك فقط. رقم الهاتف لا يظهر في ملف PDF، أما الاسم فيظهر في عنوان الملف.</div>
  <div class="row" style="margin-top:12px">
    <button class="pri" id="save" style="flex:1">حفظ</button>
    <button id="cancel">إلغاء</button>
  </div>
</div>

<div id="view" class="hide">
  <div class="row"><button id="back">← رجوع</button><button id="pdf" class="pri" style="margin-inline-start:auto">📄 حفظ PDF / طباعة</button><button id="del">حذف</button></div>
  <button id="addss" class="pri" style="width:100%;margin-top:8px">＋ إضافة جلسة جديدة لهذه الحالة</button>
  <button id="bkap" class="ic" style="width:100%;margin-top:8px;gap:8px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>حجز موعد لهذه الحالة</button>
  <button id="sm" class="ic" style="width:100%;margin-top:8px;gap:8px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg> ملخص الحالة</button>
  <div class="card" id="vc" style="margin-top:8px"></div>
  <div class="ov" id="sv"><div class="sheet" style="max-height:82vh;overflow:auto">
    <div id="svb"></div>
    <button class="pri" id="svc" style="width:100%;margin-top:12px">إغلاق</button>
  </div></div>
</div>

<div id="pr"></div>
<div id="aview" class="hide">
  <div class="row"><button id="aback">← رجوع</button><button id="adel" style="margin-inline-start:auto">حذف الموعد</button></div>
  <button id="aics" class="ic" style="width:100%;margin-top:8px;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> إضافة للتقويم (تذكير قبلها بـ 20 ساعة)</button>
  <button id="adone" class="pri" style="width:100%;margin-top:8px">✓ تم الموعد — حوّله لحالة / جلسة</button>
  <div class="card" id="avc" style="margin-top:8px"></div>
</div>

<nav id="bar">
  <button id="add" aria-label="إضافة حالة"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg></button>
  <button id="nvH" class="home" aria-label="الصفحة الرئيسية"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button id="nvP" aria-label="حجز موعد"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg></button>
</nav>

<div id="tour" data-pos="mid"><div class="tcard">
  <div class="tic" id="tic"></div><b id="ttl"></b><p id="ttx"></p><div class="tdots" id="tdots"></div>
  <div class="row" style="margin:0"><button id="tskip">تخطي</button><button id="tprev">السابق</button><button class="pri" id="tnext" style="flex:1">التالي</button></div>
</div></div>

<script>
const SP=["الكل","Operative","Fixed","Endo","Prosthesis","Surgery","Perio","Ortho","Pedo"];
const WA="201224080401";/* ضع رقم واتساب هنا بالصيغة الدولية بدون + أو أصفار، مثال: 201001234567 */
const $=id=>document.getElementById(id);
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);

let tsteps=[],tix=0;
function tourShow(){const s=tsteps[tix];document.querySelectorAll(".tgt").forEach(x=>x.classList.remove("tgt"));
  if(s.t&&$(s.t))$(s.t).classList.add("tgt");$("tour").dataset.pos=s.pos||"mid";$("tic").innerHTML=s.ic||"";$("ttl").textContent=s.ti;$("ttx").textContent=s.tx;
  $("tdots").innerHTML=tsteps.map((_,i)=>`<i class="${i==tix?"on":""}"></i>`).join("");$("tprev").style.visibility=tix?"visible":"hidden";
  $("tnext").textContent=tix==tsteps.length-1?"ابدأ الاستخدام":"التالي"}
function tourStart(l){show("list");tsteps=l;tix=0;$("tour").classList.add("on");tourShow()}

$("tnext").onclick=()=>{if(tix>=tsteps.length-1)tourEnd();else{tix++;tourShow()}};
$("tprev").onclick=()=>{if(tix>0){tix--;tourShow()}};
