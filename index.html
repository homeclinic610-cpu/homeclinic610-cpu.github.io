<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حالاتي – Dental Cases</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#0f2238;--mu:#5b6f84;--gd:#9c7220;--bl:#2a7ebc;--bd:#d3dfeb;--gold:linear-gradient(135deg,#f0d98a,#d4b574 50%,#b98f42);--sky:linear-gradient(135deg,#5fd6f6,#40a4d5 55%,#2a7ebc);--ink:#0c1a34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a34;--card:#122a48;--tx:#eef3f8;--mu:#9fb4c9;--gd:#d4b574;--bl:#5fd6f6;--bd:#1f4166}}
:root[data-theme="dark"]{--bg:#0c1a34;--card:#122a48;--tx:#eef3f8;--mu:#9fb4c9;--gd:#d4b574;--bl:#5fd6f6;--bd:#1f4166}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px;color:var(--gd)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
textarea{min-height:80px}
button{cursor:pointer;width:auto}
.pri{background:var(--gold);color:var(--ink);border:0;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:14px}
.chip{border-color:var(--bl)}
.chip.on{background:var(--gold);color:var(--ink);border-color:transparent;font-weight:700}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bl);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.mu{color:var(--mu);font-size:13px}
.th{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none}
.big img{width:100%;height:auto;margin-bottom:8px;border-radius:10px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;border-radius:50%;width:56px;height:56px;font-size:28px;padding:0;box-shadow:0 2px 8px #0004}
.hide{display:none}
.wm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(72vw,360px);aspect-ratio:1;background:url(icons/wm-light.png) center/contain no-repeat;opacity:.2;pointer-events:none;z-index:-1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{background:url(icons/icon-512.png) center/cover;border-radius:22%;opacity:.16}}
:root[data-theme="dark"] .wm{background:url(icons/icon-512.png) center/cover;border-radius:22%;opacity:.16}
.ph{position:relative}
.ph svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--bl);pointer-events:none}
.ph input{padding-left:42px;text-align:left}
.pv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.pv a{border:1px solid var(--bl);color:var(--bl);border-radius:999px;padding:5px 12px;text-decoration:none;font-size:14px}
.spc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.tc{direction:ltr;margin:6px 0 2px}
.tr2{display:flex;margin-bottom:8px}
.tr2 .h{display:flex;flex:1;min-width:0}
.tr2 .h+.h{border-left:2px solid var(--bd);margin-left:3px;padding-left:3px}
.tt{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;border-radius:6px;color:var(--mu);font-size:9px;cursor:pointer}
.tt:active{background:#8883}
.tt.ro{pointer-events:none}
.tt svg{width:100%;height:30px;display:block}
.tt path{fill:var(--card);stroke:var(--mu);stroke-width:1.4}
.tt b{font-weight:600;font-size:9px;line-height:1}
.tt i{display:flex;gap:2px;height:4px}
.tt .d{width:4px;height:4px;border-radius:50%;display:block}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin:2px 0 8px}
.lgd .d,.chip .dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs{border-top:1px solid var(--bd);padding:10px 0}
.vs b{display:block;margin-bottom:4px}
.vs div{margin:3px 0;font-size:14px}
.vs .dt,.vsh .dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.ses{border-top:1px solid var(--bd);padding:12px 0;margin-top:6px}
.ses>b{display:block;margin-bottom:4px}
.appmark{width:36px;height:36px;border-radius:10px;vertical-align:middle;margin-inline-end:8px}
.hd h1 .appmark{height:36px;margin-bottom:0}
.ic{display:inline-flex;align-items:center;justify-content:center;padding:8px;color:var(--bl);border-color:var(--bl)}
.hd{display:flex;align-items:center;gap:8px}.hd h1{margin:6px 0 12px;flex:1}.hd img{height:36px;margin-bottom:6px}
.slots{display:block}
.stage{margin-bottom:12px}
.sh{font-size:13px;color:var(--mu);margin-bottom:6px}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb{position:relative;aspect-ratio:1}
.tb img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.tb i{position:absolute;top:4px;inset-inline-end:4px;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-style:normal;cursor:pointer}
.add{aspect-ratio:1;margin:0;text-align:center;font-size:14px;gap:4px;flex-direction:column;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer}
.add input{display:none}
.cnt{font-size:13px;color:var(--mu);margin:2px 0 10px}
.fbb{background:var(--sky);color:#fff;border:0;display:flex;align-items:center;justify-content:center;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;border-radius:50%;width:56px;height:56px;padding:0;box-shadow:0 2px 10px #0006}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:640px}
.sheet textarea{margin:8px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sg div{font-size:13px;color:var(--mu)}.sg img{width:100%;border-radius:10px;display:block}
#pr{display:none}
@media print{.wm,.add,.tb i,button,.fbb,.ov{display:none!important}body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:8px}#pr img.lg{height:50px}#pr .sg div{color:#333}#pr .sg>div{break-inside:avoid}@page{margin:12mm}}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
.note{font-size:12px;color:var(--mu);margin-top:6px}
</style>
</head>
<body>
<div id="list">
  <div class="wm" aria-hidden="true"></div>
  <div class="hd"><img id="lg" class="hide" alt=""><h1><img class="appmark" src="icons/icon-192.png" alt="">حالاتي</h1><button id="gear" class="ic" aria-label="الإعدادات"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  <div id="set" class="card hide"><b>لوجو خاص بك (اختياري)</b><div class="mu" style="margin:4px 0 8px">يظهر في التطبيق وفي ملف الـ PDF.</div><div class="row"><label class="pri" style="margin:0;padding:10px;border-radius:10px;color:#fff">اختر لوجو<input id="lf" type="file" accept="image/*" hidden></label><button id="lrm">حذف اللوجو</button></div></div>
  <input id="q" placeholder="ابحث في الحالات...">
  <div class="chips" id="chips" style="margin-top:8px"></div>
  <div id="cards"></div>
  <button class="fab pri" id="add" aria-label="إضافة حالة">+</button>
  <button class="fbb" id="fbo" aria-label="شكاوي واقتراحات"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg></button>
  <div class="ov" id="fbm"><div class="sheet">
    <b>شكاوي واقتراحات</b>
    <div class="mu" style="margin:4px 0 8px">تُرسل إلينا عبر واتساب فقط.</div>
    <select id="fbk"><option>اقتراح</option><option>شكوى</option></select>
    <textarea id="fbt" placeholder="اكتب رسالتك هنا... (بدون أي بيانات مرضى)"></textarea>
    <div class="row" style="margin:8px 0 0"><button class="pri" id="fbs" style="flex:1">إرسال عبر واتساب</button><button id="fbc">إلغاء</button></div>
  </div></div>
</div>

<div id="form" class="hide">
  <h1 id="ft">حالة جديدة</h1>
  <label class="pf">اسم المريض</label><input id="t" class="pf" placeholder="مثال: مصطفى أحمد">
  <div class="two pf"><div><label>العمر (بالسنوات)</label><input id="ag" type="number" inputmode="numeric" min="0" max="120" placeholder="مثال: 35"></div>
  <div><label>النوع</label><div class="spc" id="sx"></div></div></div>
  <label>التخصص (يمكنك اختيار أكثر من تخصص)</label><div class="spc" id="sps"></div>
  <label>الأسنان (اضغط على السن لتحديد ما تم عليه)</label>
  <div id="tc"></div>
  <div class="ov" id="tm"><div class="sheet">
    <b id="tmt"></b>
    <div class="mu" style="margin:4px 0 8px">اختر ما تم عمله على هذا السن (يمكن أكثر من اختيار)</div>
    <div class="spc" id="tmo"></div>
    <div class="row" style="margin:8px 0 0"><button class="pri" id="tmd" style="flex:1">تم</button><button id="tmc">مسح العلامة</button></div>
  </div></div>
  <label>التاريخ</label><input id="d" type="date">
  <label class="pf">رقم هاتف المريض (اختياري)</label><div class="ph pf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><input id="ph" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx" autocomplete="off"></div>
  <label>الصور (داخل الفم فقط) – يمكنك إضافة أكثر من صورة لكل مرحلة (بدون حد أقصى)</label>
  <div class="cnt" id="cnt"></div>
  <div class="slots" id="slots"></div>
  <label>التفاصيل (التشخيص، خطوات العلاج، الخامات...)</label><textarea id="n"></textarea>
  <div class="note">ملحوظة: الاسم ورقم الهاتف يُحفظان على جهازك فقط. رقم الهاتف لا يظهر في ملف PDF، أما الاسم فيظهر في عنوان الملف.</div>
  <div class="row" style="margin-top:12px">
    <button class="pri" id="save" style="flex:1">حفظ</button>
    <button id="cancel">إلغاء</button>
  </div>
</div>

<div id="view" class="hide">
  <div class="row"><button id="back">← رجوع</button><button id="pdf" class="pri" style="margin-inline-start:auto">📄 حفظ PDF / طباعة</button><button id="del">حذف</button></div>
  <button id="addss" class="pri" style="width:100%;margin-top:8px">＋ إضافة جلسة جديدة لهذه الحالة</button>
  <button id="sm" class="ic" style="width:100%;margin-top:8px;gap:8px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg> ملخص الحالة</button>
  <div class="card" id="vc" style="margin-top:8px"></div>
  <div class="ov" id="sv"><div class="sheet" style="max-height:82vh;overflow:auto">
    <div id="svb"></div>
    <button class="pri" id="svc" style="width:100%;margin-top:12px">إغلاق</button>
  </div></div>
</div>

<div id="pr"></div>
<script>
const SP=["الكل","Operative","Fixed","Endo","Prosthesis","Surgery","Perio","Ortho","Pedo"];
const WA="201224080401";/* ضع رقم واتساب هنا بالصيغة الدولية بدون + أو أصفار، مثال: 201001234567 */
const $=id=>document.getElementById(id);
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
const tot=o=>stagesFor(sel).reduce((n,k)=>n+arr(o[k]).length,0);
const ST={Operative:["Before","Cavity","After"],Fixed:["Before","Preparation","After"],Endo:["Before","X-ray Master Cone","X-ray Obturation","After"],Prosthesis:["Before","Try-in","After"]};
const stg=sp=>ST[sp]||["Before","After"];
let sel=[],teeth={},tcur=0,sex="",spAuto=true;
const TC={Operative:"#40a4d5",Fixed:"#d4b574",Endo:"#e0626f",Prosthesis:"#9b7be0",Surgery:"#e0884a",Perio:"#4fb286",Ortho:"#27c4d8",Pedo:"#e08fbc"};
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const TOOTH="M6 2C3 2 2 5 2 9c0 5 2 8 3 13 .5 4 1.5 8 3.5 8s2-6 3.5-6 1.5 6 3.5 6 3-4 3.5-8c1-5 3-8 3-13 0-4-1-7-4-7-2.5 0-4 1.5-6 1.5S8.5 2 6 2z";
const col=x=>TC[x]||"#999";
function legend(t){const u=[...new Set(Object.values(t).flat())];return u.length?`<div class="lgd">${u.map(x=>`<span><span class="dt" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;background:${col(x)}"></span>${esc(x)}</span>`).join("")}</div>`:""}
function chart(t,edit){const mk=n=>{const a=t[n]||[],c=a.length?col(a[0]):"",up=UP.includes(n);
    const sv=`<svg viewBox="0 0 24 32" style="${up?"transform:scaleY(-1)":""}"><path d="${TOOTH}"${c?` style="fill:${c};stroke:${c}"`:""}/></svg>`;
    const dots=`<i>${a.map(x=>`<span class="d" style="background:${col(x)}"></span>`).join("")}</i>`,num=`<b>${n}</b>`;
    return `<button type="button" class="tt${edit?"":" ro"}" data-t="${n}" aria-label="سن ${n}">${up?num+dots+sv:sv+dots+num}</button>`};
  const row=l=>`<div class="tr2"><div class="h">${l.slice(0,8).map(mk).join("")}</div><div class="h">${l.slice(8).map(mk).join("")}</div></div>`;
  return `<div class="tc">${row(UP)}${row(LO)}</div>`+legend(t)}
const tkeys=t=>Object.keys(t||{}).filter(k=>(t[k]||[]).length).sort((a,b)=>a-b);
const teethLine=c=>tkeys(c.teeth).map(k=>`${k} (${c.teeth[k].join(" + ")})`).join(" · ");
const demo=c=>{const a=[c.sex,c.age?c.age+" سنة":""].filter(Boolean);return a.length?`<div class="mu">${esc(a.join(" · "))}</div>`:""};
function sxChips(){$("sx").innerHTML=["ذكر","أنثى"].map(x=>`<button type="button" class="chip ${sex==x?"on":""}" data-s="${x}">${x}</button>`).join("")}
$("sx").onclick=e=>{const x=e.target.dataset.s;if(!x)return;sex=sex==x?"":x;sxChips()};
function summary(c){const k=x=>String(x.t||"").trim().toLowerCase();
  const L=cases.filter(x=>k(x)==k(c));
  const V=L.flatMap(x=>sessOf(x)).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const info=[...L].reverse().find(x=>x.sex||x.age)||{};
  let h=`<h3 style="margin:0">${esc(c.t)}</h3>${demo(info)}<div class="mu">عدد الجلسات: ${V.length}</div>`;
  V.forEach(x=>{const by={};tkeys(x.teeth).forEach(t=>x.teeth[t].forEach(tr=>(by[tr]=by[tr]||[]).push(t)));
    const used=Object.keys(by),rest=spsOf(x).filter(y=>!used.includes(y));
    h+=`<div class="vs"><b>${x.date?fd(x.date):"بدون تاريخ"}</b>`+
      SP.slice(1).filter(y=>by[y]).map(y=>`<div dir="ltr" style="text-align:right"><span class="dt" style="background:${col(y)}"></span>${esc(y)}: ${by[y].join(" - ")}</div>`).join("")+
      (rest.length?`<div class="mu">${used.length?"تخصصات أخرى: ":"التخصصات: "}${esc(rest.join(" + "))}</div>`:"")+`</div>`});
  return h}
$("sm").onclick=()=>{if(!cur)return;$("svb").innerHTML=summary(cur);$("sv").classList.add("on")};
$("svc").onclick=()=>$("sv").classList.remove("on");
$("sv").onclick=e=>{if(e.target===$("sv"))$("sv").classList.remove("on")};
function drawTeeth(){$("tc").innerHTML=chart(teeth,true)}
const spsOf=c=>Array.isArray(c.sps)&&c.sps.length?c.sps:[c.sp];
const spl=c=>spsOf(c).join(" + ");
const sessOf=c=>[{date:c.date||"",sps:spsOf(c),teeth:c.teeth||{},im:c.im||{},n:c.n||""}].concat((c.ss||[]).map(x=>({id:x.id,date:x.date||"",sps:x.sps&&x.sps.length?x.sps:[c.sp],teeth:x.teeth||{},im:x.im||{},n:x.n||""}))).map((x,i)=>({...x,o:i})).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.o-b.o);
const allSps=c=>{const u=new Set(sessOf(c).flatMap(x=>x.sps));return SP.slice(1).filter(x=>u.has(x))};
const allImgs=c=>sessOf(c).flatMap(x=>Object.values(x.im).flatMap(arr));
const lastDate=c=>sessOf(c).map(x=>x.date).sort().pop()||"";
const allTeeth=c=>[...new Set(sessOf(c).flatMap(x=>tkeys(x.teeth)))].sort((a,b)=>a-b);
let addTo=null;
const fd=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?`<bdi dir="ltr">${m[3]}/${m[2]}/${m[1]}</bdi>`:esc(d||"")};
const stagesFor=l=>{const mid=[];l.forEach(sp=>stg(sp).forEach(k=>{if(k!="Before"&&k!="After"&&!mid.includes(k))mid.push(k)}));return["Before",...mid,"After"]};
let db,cases=[],flt="الكل",imgs={},cur=null,mem=[],logo="";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function open(){return new Promise(r=>{try{const q=indexedDB.open("cases",1);q.onupgradeneeded=()=>q.result.createObjectStore("c",{keyPath:"id"});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function all(){return new Promise(r=>{if(!db)return r(mem);const q=db.transaction("c").objectStore("c").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r(mem)})}
function put(c){return new Promise(r=>{if(!db){mem=mem.filter(x=>x.id!=c.id).concat(c);return r()}const t=db.transaction("c","readwrite");t.objectStore("c").put(c);t.oncomplete=r;t.onerror=r})}
function rm(id){return new Promise(r=>{if(!db){mem=mem.filter(x=>x.id!=id);return r()}const t=db.transaction("c","readwrite");t.objectStore("c").delete(id);t.oncomplete=r;t.onerror=r})}

function shrink(file,png){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const m=png?400:1280,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.8))};i.src=fr.result};fr.readAsDataURL(file)})}

function grid(c){return `<div class="sg">${stagesFor(spsOf(c)).flatMap(k=>arr(c.im[k]).map((x,i,a)=>`<div>${k}${a.length>1?" "+(i+1):""}<img src="${x}" alt=""></div>`)).join("")}</div>`}
function slots(){const full=false;
  $("cnt").textContent="عدد الصور: "+tot(imgs);
  $("slots").innerHTML=stagesFor(sel).map(k=>`<div class="stage" data-k="${k}"><div class="sh">${k}</div><div class="tr">${arr(imgs[k]).map((x,i)=>`<div class="tb"><img src="${x}" alt=""><i data-x="${k}" data-i="${i}">×</i></div>`).join("")}${full?"":`<label class="add"><span style="font-size:30px;line-height:1">+</span>إضافة صورة<input type="file" accept="image/*" multiple></label>`}</div></div>`).join("")}
function phoneRow(p){if(!p)return"";const d=String(p).replace(/[^\d+]/g,""),n=d.replace(/\D/g,""),w=n.startsWith("00")?n.slice(2):n.startsWith("0")?"20"+n.slice(1):n;
  return `<div class="pv"><span dir="ltr">${esc(p)}</span><a href="tel:${esc(d)}">اتصال</a><a href="https://wa.me/${esc(w)}" target="_blank" rel="noopener">واتساب</a></div>`}
function show(p){["list","form","view"].forEach(x=>$(x).classList.toggle("hide",x!=p));window.scrollTo(0,0)}

async function render(){
  const A=await all();const lr=A.find(x=>x.id=="logo");logo=lr?lr.d:"";$("lg").src=logo;$("lg").classList.toggle("hide",!logo);
  cases=A.filter(x=>x.id!="logo").sort((a,b)=>lastDate(b).localeCompare(lastDate(a)));
  $("chips").innerHTML=SP.map(s=>`<button class="chip ${s==flt?"on":""}" data-s="${s}">${s}</button>`).join("");
  const q=$("q").value.trim().toLowerCase();
  const l=cases.filter(c=>(flt=="الكل"||allSps(c).includes(flt))&&(!q||(c.t+" "+sessOf(c).map(x=>x.n).join(" ")+" "+(c.ph||"")+" "+allTeeth(c).join(" ")).toLowerCase().includes(q)));
  $("cards").innerHTML=l.length?l.map(c=>{const n=sessOf(c).length,tt=allTeeth(c),im=allImgs(c);return `<div class="card" data-id="${c.id}"><h3>${esc(c.t)}</h3><div class="mu">${esc(allSps(c).join(" + "))} · ${fd(lastDate(c))}${n>1?` · ${n} جلسات`:""}</div>${tt.length?`<div class="mu">الأسنان: ${tt.join(" · ")}</div>`:""}${im.length?`<div class="th">${im.map(x=>`<img src="${x}" alt="">`).join("")}</div>`:""}</div>`}).join(""):`<p class="mu" style="text-align:center;margin-top:40px">لا توجد حالات بعد. اضغط + لإضافة أول حالة.</p>`;
}

$("chips").onclick=e=>{const s=e.target.dataset.s;if(s){flt=s;render()}};
$("q").oninput=render;
function openView(c){cur=c;
  $("vc").innerHTML=`<h3>${esc(c.t)}</h3>${demo(c)}${phoneRow(c.ph)}`+sessOf(c).map((x,i,A)=>`<div class="ses"><b>${A.length>1?`الجلسة ${i+1} · `:""}${fd(x.date)}</b>${x.id?`<button type="button" class="ic" data-ds="${x.id}" style="float:left;padding:2px 10px;font-size:12px">حذف الجلسة</button>`:""}<div class="mu">${esc(spl(x))}</div>${tkeys(x.teeth).length?chart(x.teeth,false)+`<div class="mu" dir="ltr" style="margin-bottom:8px;text-align:right">${esc(teethLine(x))}</div>`:""}${grid(x)}${x.n?`<p style="white-space:pre-wrap">${esc(x.n)}</p>`:""}</div>`).join("");show("view")}
$("cards").onclick=e=>{const el=e.target.closest(".card");if(!el)return;openView(cases.find(c=>c.id==el.dataset.id))};
$("vc").onclick=async e=>{const id=e.target.dataset.ds;if(!id||!cur)return;if(!confirm("حذف هذه الجلسة نهائيًا؟"))return;
  cur.ss=(cur.ss||[]).filter(x=>x.id!=id);await put(cur);await render();openView(cases.find(c=>c.id==cur.id))};
$("addss").onclick=()=>{if(!cur)return;addTo=cur.id;imgs={};teeth={};spAuto=true;$("n").value="";$("d").value=new Date().toISOString().slice(0,10);
  const last=sessOf(cur).slice(-1)[0];sel=[(last.sps[0])||SP[1]];$("ft").textContent="جلسة جديدة — "+cur.t;
  document.querySelectorAll(".pf").forEach(x=>x.style.display="none");drawTeeth();spchips();slots();show("form")};
$("back").onclick=()=>show("list");
$("del").onclick=async()=>{if(cur&&confirm("حذف الحالة نهائيًا؟")){await rm(cur.id);await render();show("list")}};
$("add").onclick=()=>{addTo=null;$("ft").textContent="حالة جديدة";document.querySelectorAll(".pf").forEach(x=>x.style.display="");imgs={};$("t").value="";$("ph").value="";$("n").value="";$("d").value=new Date().toISOString().slice(0,10);$("ag").value="";sex="";spAuto=true;sxChips();teeth={};drawTeeth();sel=[flt!="الكل"?flt:SP[1]];spchips();slots();show("form")};
$("cancel").onclick=()=>{const v=addTo;addTo=null;show(v?"view":"list")};
function tmChips(){$("tmo").innerHTML=SP.slice(1).map(x=>`<button type="button" class="chip ${(teeth[tcur]||[]).includes(x)?"on":""}" data-s="${x}"><span class="dt" style="background:${col(x)}"></span>${x}</button>`).join("")}
$("tc").onclick=e=>{const b=e.target.closest(".tt");if(!b)return;tcur=+b.dataset.t;$("tmt").textContent="سن رقم "+tcur;tmChips();$("tm").classList.add("on")};
$("tmo").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const x=b.dataset.s,a=teeth[tcur]||[];
  if(a.includes(x)){teeth[tcur]=a.filter(y=>y!=x);if(!teeth[tcur].length)delete teeth[tcur]}
  else{teeth[tcur]=a.concat(x);if(spAuto){sel=[x];spAuto=false;spchips();slots()}else if(!sel.includes(x)){sel=SP.slice(1).filter(y=>sel.includes(y)||y==x);spchips();slots()}}
  tmChips();drawTeeth()};
$("tmd").onclick=()=>$("tm").classList.remove("on");
$("tmc").onclick=()=>{delete teeth[tcur];drawTeeth();$("tm").classList.remove("on")};
$("tm").onclick=e=>{if(e.target===$("tm"))$("tm").classList.remove("on")};
function spchips(){$("sps").innerHTML=SP.slice(1).map(x=>`<button type="button" class="chip ${sel.includes(x)?"on":""}" data-s="${x}">${x}</button>`).join("")}
$("sps").onclick=e=>{const x=e.target.dataset.s;if(!x)return;spAuto=false;
  if(sel.includes(x)){if(sel.length==1){alert("اختر تخصصًا واحدًا على الأقل");return}sel=sel.filter(y=>y!=x)}else{sel=SP.slice(1).filter(y=>sel.includes(y)||y==x)}
  spchips();slots()};
$("slots").onclick=e=>{const x=e.target.dataset.x;if(x){e.preventDefault();arr(imgs[x]).splice(+e.target.dataset.i,1);imgs[x]=arr(imgs[x]);if(!imgs[x].length)delete imgs[x];slots()}};
$("slots").onchange=async e=>{const st=e.target.closest(".stage");if(!st)return;const k=st.dataset.k;
  for(const f of [...e.target.files]){imgs[k]=arr(imgs[k]).concat(await shrink(f))}
  slots()};
$("gear").onclick=()=>$("set").classList.toggle("hide");
$("lf").onchange=async e=>{const f=e.target.files[0];if(f){await put({id:"logo",d:await shrink(f,true)});render()}};
$("lrm").onclick=async()=>{await rm("logo");render()};
$("pdf").onclick=()=>{if(!cur)return;const A=sessOf(cur);
  $("pr").innerHTML=`${logo?`<img class="lg" src="${logo}" alt="">`:""}<h2 style="margin:6px 0">${esc(cur.t)}</h2>${demo(cur)}`+A.map((x,i)=>`<div style="margin-top:${i?16:0}px">${A.length>1?`<b>الجلسة ${i+1} · ${fd(x.date)}</b><div>${esc(spl(x))}</div>`:`<div>${esc(spl(x))} · ${fd(x.date)}</div>`}${tkeys(x.teeth).length?`<div dir="ltr" style="text-align:right">${esc(teethLine(x))}</div>`:""}${grid(x)}${x.n?`<p style="white-space:pre-wrap">${esc(x.n)}</p>`:""}</div>`).join("");setTimeout(()=>window.print(),200)};
$("save").onclick=async()=>{
  if(addTo){const c=cases.find(x=>x.id==addTo);if(!c){addTo=null;show("list");return}
    c.ss=(c.ss||[]).concat({id:Date.now(),date:$("d").value,sps:sel.slice(),teeth:Object.fromEntries(tkeys(teeth).map(k=>[k,teeth[k]])),n:$("n").value,im:Object.fromEntries(stagesFor(sel).filter(k=>arr(imgs[k]).length).map(k=>[k,imgs[k]]))});
    await put(c);addTo=null;await render();openView(cases.find(x=>x.id==c.id));return}
  if(!$("t").value.trim()){alert("اكتب اسم المريض");return}
  await put({id:Date.now(),t:$("t").value.trim(),sp:sel[0],sps:sel.slice(),teeth:Object.fromEntries(tkeys(teeth).map(k=>[k,teeth[k]])),date:$("d").value,ph:$("ph").value.trim(),age:$("ag").value.trim(),sex:sex,n:$("n").value,im:Object.fromEntries(stagesFor(sel).filter(k=>arr(imgs[k]).length).map(k=>[k,imgs[k]]))});
  await render();show("list")};

$("fbo").onclick=()=>$("fbm").classList.add("on");
$("fbc").onclick=()=>$("fbm").classList.remove("on");
$("fbm").onclick=e=>{if(e.target===$("fbm"))$("fbm").classList.remove("on")};
$("fbs").onclick=()=>{const t=$("fbt").value.trim();if(!t){alert("اكتب رسالتك أولًا");return}
  if(!WA){alert("رقم الواتساب غير مضبوط بعد");return}
  const a=document.createElement("a");a.href="https://wa.me/"+WA+"?text="+encodeURIComponent("["+$("fbk").value+"] حالاتي:\n"+t);a.target="_blank";a.rel="noopener";a.click();$("fbt").value="";$("fbm").classList.remove("on")};

open().then(render);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
